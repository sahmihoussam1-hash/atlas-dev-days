<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="inscription"> 
<header>
    <h2>Atlas Dev Days</h2>
    <nav>
      <ol>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="programme.html">Programme</a></li>
        <li><a href="intervenants.html">Intervenants</a></li>
        <li><a href="inscription.html">Inscription</a></li>
      </ol>
    </nav>
  </header>

<main>
  <h1>S'inscrire</h1>

  <form action="#" method="POST">

    <label for="fullname">Nom complet :</label>
    <input type="text" id="fullname" name="fullname"
           required placeholder="Ex : Houssam Amrani">

    <label for="email">Adresse e-mail :</label>
    <input type="email" id="email" name="email"
           required placeholder="nom@exemple.com">

    <label for="phone">N° Téléphone :</label>
    <input type="tel" id="phone" name="phone"
           required placeholder="0600000000">

    <label for="day-select">Jour :</label>
    <select id="day-select" name="day" required>
      <option value="">-- Sélectionnez une option --</option>
      <option value="jour1">Jour 1 (09 Oct)</option>
      <option value="jour2">Jour 2 (10 Oct)</option>
      <option value="pass2jours">Pass 2 Jours</option>
    </select>

    <div>
      <input type="checkbox" id="terms" name="terms" required>
      <label for="terms">
        J'accepte les conditions générales d'utilisation
      </label>
    </div>

    <button type="submit">Valider mon inscription</button>

  </form>
</main>
  <footer>
    <p>&copy; 2026 Association Atlas Dev. Tous droits réservés.</p>
  </footer>
</body>
</html>
